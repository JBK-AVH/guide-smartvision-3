<script>
(function(){
  "use strict";

  /* ============================================================
     1. OUTILS DE BASE
     ============================================================ */
  const $  = (sel, ctx = document) => ctx.querySelector(sel);
  const $$ = (sel, ctx = document) => Array.from(ctx.querySelectorAll(sel));

  /* ============================================================
     2. SYNTHÈSE VOCALE (voix au focus + lecture manuelle)
     ============================================================ */
  const synth = window.speechSynthesis;
  let voixActivee = true;       // voix au focus
  let derniereUtterance = null;

  function parler(texte) {
    if (!synth || !texte) return;
    synth.cancel();                       // coupe une éventuelle lecture en cours
    const u = new SpeechSynthesisUtterance(texte.trim());
    u.lang = "fr-FR";
    u.rate = 1;
    u.pitch = 1;
    derniereUtterance = u;
    synth.speak(u);
  }

  function arreterVoix() {
    if (synth) synth.cancel();
  }

  /* Bouton « Voix au focus » */
  const btnVoix = $("#btn-voix");
  if (btnVoix) {
    btnVoix.addEventListener("click", () => {
      voixActivee = !voixActivee;
      btnVoix.setAttribute("aria-pressed", String(voixActivee));
      btnVoix.textContent = voixActivee
        ? "🔊 Voix au focus : activée"
        : "🔇 Voix au focus : désactivée";
      if (!voixActivee) arreterVoix();
    });
  }

  /* Bouton « Arrêter la lecture » */
  const btnStop = $("#btn-stop");
  if (btnStop) btnStop.addEventListener("click", arreterVoix);

  /* Raccourci Alt + L pour couper la voix (comme indiqué dans l’en-tête) */
  document.addEventListener("keydown", (e) => {
    if (e.altKey && (e.key === "l" || e.key === "L")) {
      e.preventDefault();
      arreterVoix();
      if (btnVoix) {
        voixActivee = false;
        btnVoix.setAttribute("aria-pressed", "false");
        btnVoix.textContent = "🔇 Voix au focus : désactivée";
      }
    }
  });

  /* Lecture automatique au focus (uniquement si la voix est activée) */
  document.addEventListener("focusin", (e) => {
    if (!voixActivee) return;
    const cible = e.target;
    if (!cible || cible === document.body) return;

    // On ne vocalise que les éléments significatifs
    const selecteurs = "summary, button, input, select, label, a, kbd, h2, h3, h4, p";
    if (cible.matches(selecteurs)) {
      let texte = "";
      if (cible.matches("summary")) texte = cible.textContent;
      else if (cible.matches("button")) texte = cible.textContent;
      else if (cible.matches("label")) texte = cible.textContent;
      else if (cible.matches("input")) {
        const lab = cible.closest("label");
        texte = lab ? lab.textContent : (cible.getAttribute("aria-label") || cible.value || "");
      }
      else if (cible.matches("select")) {
        texte = cible.options[cible.selectedIndex]?.text || "";
      }
      else texte = cible.textContent;
      parler(texte);
    }
  });

  /* ============================================================
     3. BOUTONS « LIRE À VOIX HAUTE » DANS CHAQUE FICHE
     ============================================================ */
  $$(".outils-carte .lire").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.preventDefault();
      const carte = btn.closest("article.carte");
      if (!carte) return;
      const corps = $(".corps", carte);
      if (!corps) return;
      // On nettoie le texte (supprime les espaces superflus)
      const texte = corps.innerText.replace(/\s+/g, " ").trim();
      parler(texte);
    });
  });

  /* ============================================================
     4. FILTRAGE PAR NIVEAU (onglets)
     ============================================================ */
  const onglets = $$(".onglet");
  const blocs = {
    basique  : $("#bloc-basique"),
    maitrisee: $("#bloc-maitrisee"),
    avancee  : $("#bloc-avancee")
  };

  function afficherNiveau(niveau) {
    // Mise à jour des boutons
    onglets.forEach(b => {
      b.setAttribute("aria-pressed", String(b.dataset.niveau === niveau));
    });

    // Affichage / masquage des blocs
    Object.entries(blocs).forEach(([cle, bloc]) => {
      if (!bloc) return;
      if (niveau === "tout") bloc.hidden = false;
      else bloc.hidden = (cle !== niveau);
    });

    // On replie toutes les fiches pour repartir proprement
    $$("article.carte details").forEach(d => d.open = false);

    // On remonte en haut du contenu
    const cible = niveau === "tout" ? $("#contenu") : blocs[niveau];
    if (cible) cible.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  onglets.forEach(btn => {
    btn.addEventListener("click", () => afficherNiveau(btn.dataset.niveau));
  });

  // Par défaut : basique
  afficherNiveau("basique");

  /* ============================================================
     5. RECHERCHE DANS LES FICHES
     ============================================================ */
  const champRecherche = $("#q");
  const resultatRecherche = $("#resultat-recherche");
  const btnEffacer = $("#btn-effacer-recherche");

  function filtrerCartes() {
    const terme = (champRecherche?.value || "").toLowerCase().trim();
    const cartes = $$("article.carte");

    if (!terme) {
      cartes.forEach(c => c.hidden = false);
      if (resultatRecherche) resultatRecherche.textContent = "";
      return;
    }

    let trouvees = 0;
    cartes.forEach(c => {
      const txt = c.innerText.toLowerCase();
      if (txt.includes(terme)) {
        c.hidden = false;
        trouvees++;
        // On ouvre automatiquement les résultats
        const d = c.querySelector("details");
        if (d) d.open = true;
      } else {
        c.hidden = true;
      }
    });

    if (resultatRecherche) {
      resultatRecherche.textContent = trouvees === 0
        ? "Aucune fiche ne correspond à votre recherche."
        : `${trouvees} fiche${trouvees > 1 ? "s" : ""} trouvée${trouvees > 1 ? "s" : ""}.`;
    }
  }

  if (champRecherche) {
    champRecherche.addEventListener("input", filtrerCartes);
  }
  if (btnEffacer) {
    btnEffacer.addEventListener("click", () => {
      if (champRecherche) champRecherche.value = "";
      filtrerCartes();
      champRecherche?.focus();
    });
  }

  /* ============================================================
     6. PROGRESSION (cases à cocher)
     ============================================================ */
  const texteProgres = $("#texte-progres");
  const barreProgres = $("#barre-progres");
  const cases = $$('input[type="checkbox"][data-cle]');

  function mettreAJourProgression() {
    const total = cases.length;
    const cochees = cases.filter(c => c.checked).length;
    const pourcent = total === 0 ? 0 : Math.round((cochees / total) * 100);

    if (barreProgres) {
      barreProgres.value = pourcent;
      barreProgres.textContent = pourcent + " %";
    }
    if (texteProgres) {
      texteProgres.textContent =
        `Progression : ${cochees} étape${cochees > 1 ? "s" : ""} terminée${cochees > 1 ? "s" : ""} sur ${total} (${pourcent} %).`;
    }
  }

  cases.forEach(c => c.addEventListener("change", mettreAJourProgression));
  mettreAJourProgression();

  /* ============================================================
     7. QUIZ
     ============================================================ */
  const questions = {
    basique: [
      {
        q: "Quelle touche permet de valider l’élément sélectionné à l’écran ?",
        reponses: ["La touche OK", "La touche Accueil", "La touche Effacer"],
        bonne: 0
      },
      {
        q: "Que fait un appui long sur la touche Accueil ?",
        reponses: ["Ouvrir les applications récentes", "Revenir à l’écran d’accueil", "Ouvrir le volet des notifications"],
        bonne: 0
      },
      {
        q: "Quel geste permet d’ouvrir le volet des notifications avec Talkback ?",
        reponses: ["Balayer à deux doigts vers le bas depuis le haut de l’écran", "Un appui long sur Retour", "Un double tapotement"],
        bonne: 0
      }
    ],
    maitrisee: [
      {
        q: "Quel raccourci ouvre les paramètres rapides ?",
        reponses: ["Dièse + 3", "Étoile + 1", "Dièse + 0"],
        bonne: 0
      },
      {
        q: "À quoi sert la fonction SOS ?",
        reponses: ["À envoyer des appels et messages d’urgence géolocalisés", "À éteindre le téléphone à distance", "À réinitialiser les paramètres"],
        bonne: 0
      },
      {
        q: "Comment désactiver complètement l’écran tactile ?",
        reponses: ["Dans Accessibilité KAPSYS › Désactiver l’écran tactile", "En appuyant sur Dièse + 7", "En maintenant OK + Effacer"],
        bonne: 0
      }
    ],
    avancee: [
      {
        q: "Quel mode de Kapten donne la distance et la direction à vol d’oiseau ?",
        reponses: ["Le guidage cardinal", "La navigation piétonne", "La lecture de carte"],
        bonne: 0
      },
      {
        q: "Que signifie un cap « 3 heures » en guidage cardinal ?",
        reponses: ["Dirigez-vous sur votre droite", "Allez tout droit", "Faites demi-tour"],
        bonne: 0
      },
      {
        q: "Quel code compose-t-on pour réinitialiser les paramètres Talkback ?",
        reponses: ["*#111#", "*#333#", "*#123#"],
        bonne: 0
      }
    ]
  };

  function construireQuiz(idConteneur, cleNiveau) {
    const conteneur = $("#" + idConteneur);
    if (!conteneur) return;
    const liste = questions[cleNiveau];
    if (!liste) return;

    conteneur.innerHTML = "";

    liste.forEach((item, index) => {
      const fieldset = document.createElement("fieldset");
      fieldset.className = "question";

      const legend = document.createElement("legend");
      legend.textContent = `Question ${index + 1} — ${item.q}`;
      fieldset.appendChild(legend);

      item.reponses.forEach((rep, i) => {
        const label = document.createElement("label");
        label.className = "reponse";

        const input = document.createElement("input");
        input.type = "radio";
        input.name = `quiz-${cleNiveau}-${index}`;
        input.value = i;

        label.appendChild(input);
        label.appendChild(document.createTextNode(" " + rep));
        fieldset.appendChild(label);
      });

      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = "Vérifier";
      fieldset.appendChild(btn);

      const retour = document.createElement("p");
      retour.className = "retour";
      retour.setAttribute("aria-live", "polite");
      fieldset.appendChild(retour);

      btn.addEventListener("click", () => {
        const selection = fieldset.querySelector('input[type="radio"]:checked');
        if (!selection) {
          retour.textContent = "Veuillez sélectionner une réponse.";
          retour.className = "retour faux";
          return;
        }
        const choix = parseInt(selection.value, 10);
        if (choix === item.bonne) {
          retour.textContent = "✅ Bonne réponse !";
          retour.className = "retour bon";
        } else {
          retour.textContent = `❌ Réponse incorrecte. La bonne réponse était : « ${item.reponses[item.bonne]} ».`;
          retour.className = "retour faux";
        }
        // Vocalisation du retour
        if (voixActivee) parler(retour.textContent);
      });

      conteneur.appendChild(fieldset);
    });
  }

  construireQuiz("quiz-basique", "basique");
  construireQuiz("quiz-maitrisee", "maitrisee");
  // Le quiz avancé n’est pas présent dans le HTML fourni, mais on peut l’ajouter
  // construireQuiz("quiz-avancee", "avancee");

  /* ============================================================
     8. THÈMES ET TAILLE DE TEXTE
     ============================================================ */
  const choixTheme = $("#choix-theme");
  if (choixTheme) {
    choixTheme.addEventListener("change", () => {
      document.body.classList.remove("clair", "contraste");
      if (choixTheme.value === "clair") document.body.classList.add("clair");
      if (choixTheme.value === "contraste") document.body.classList.add("contraste");
    });
  }

  const btnPlus = $("#btn-plus");
  const btnMoins = $("#btn-moins");
  let taille = 1.1; // valeur de départ en rem

  function appliquerTaille() {
    taille = Math.min(2, Math.max(0.8, taille));
    document.documentElement.style.setProperty("--taille", taille + "rem");
  }

  if (btnPlus) btnPlus.addEventListener("click", () => { taille += 0.1; appliquerTaille(); });
  if (btnMoins) btnMoins.addEventListener("click", () => { taille -= 0.1; appliquerTaille(); });

  /* ============================================================
     9. LECTURE DE L’INTRODUCTION (bouton dédié)
     ============================================================ */
  const btnLirePage = $("#btn-lire-page");
  if (btnLirePage) {
    btnLirePage.addEventListener("click", () => {
      const intro = $(".intro-niveau");
      if (intro) parler(intro.innerText.replace(/\s+/g, " ").trim());
    });
  }

})();
</script>
